name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish jar
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: forge-mod
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            forge-mod/.gradle
          key: forge-mod-gradle2.7-${{ hashFiles('forge-mod/build.gradle', 'forge-mod/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: forge-mod-gradle2.7-

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew setupCIWorkspace build --stacktrace --no-daemon

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LunarForge-${{ github.ref_name }}
          path: forge-mod/build/libs/*.jar
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HASH=$(sha256sum forge-mod/build/libs/*.jar | awk '{print $1}')
          notes="LunarForge ${GITHUB_REF_NAME} - built from commit ${GITHUB_SHA}.

          SHA256:
          \`${HASH}\`

          原项目出处: https://codeberg.org/MegaPVP/LunarForge (原作者: MegaPVP)"
          gh release create "${GITHUB_REF_NAME}" forge-mod/build/libs/*.jar \
            --title "LunarForge ${GITHUB_REF_NAME}" \
            --notes "$notes"
        working-directory: .
